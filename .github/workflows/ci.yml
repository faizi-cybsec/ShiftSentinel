name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test CLI on sample data
        run: |
          python -m shiftsentinel.cli --version
          python -m shiftsentinel.cli ingest --input samples/alerts.csv
          python -m shiftsentinel.cli ingest --input samples/logsentinel_report.json
          python -m shiftsentinel.cli report --input samples/logsentinel_report.json --format all --output /tmp/handover_test.html
