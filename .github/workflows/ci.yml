name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev tools
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy shiftsentinel

      - name: Run tests (pytest)
        run: python -m pytest -q

      - name: Smoke test CLI on sample data
        run: |
          python -m shiftsentinel.cli --version
          python -m shiftsentinel.cli ingest --input samples/alerts.csv
          python -m shiftsentinel.cli ingest --input samples/logsentinel_report.json
          python -m shiftsentinel.cli report --input samples/logsentinel_report.json --format all --output /tmp/handover_test.html
