[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftsentinel"
version = "1.0.0"
description = "SOC shift handover report generator with alert grouping, persistent watchlist, and HTML/Markdown/terminal reporting."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Faizan Ahmed" }
]
keywords = ["soc", "security", "incident-response", "siem", "handover", "blue-team"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
shiftsentinel = "shiftsentinel.cli:main"

[tool.setuptools.packages.find]
include = ["shiftsentinel*"]
