[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftsentinel"
version = "1.0.0"
description = "SOC shift handover report generator with alert grouping, persistent watchlist, and HTML/Markdown/terminal reporting."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Faizan Ahmed" }
]
keywords = ["soc", "security", "incident-response", "siem", "handover", "blue-team"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
shiftsentinel = "shiftsentinel.cli:main"

[tool.setuptools.packages.find]
include = ["shiftsentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "PIE", "ISC", "RUF", "TRY004"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
